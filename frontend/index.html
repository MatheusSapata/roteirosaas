<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iPhone e iPad ampliam a tela ao tocar num campo com letra menor que 16px, e ela fica
      // ampliada, cortando a lateral. maximum-scale=1 desliga só esse zoom automático: no iOS
      // o zoom de pinça continua funcionando. Os outros aparelhos ficam como estão.
      (function () {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var viewport = document.querySelector('meta[name="viewport"]');
        if (isIOS && viewport) viewport.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0");
      })();
    </script>
    <!--default-meta-->
    <title>Roteiro Online</title>
    <meta name="description" content="Crie e compartilhe roteiros profissionais com o Roteiro Online." />
    <meta name="theme-color" content="#12B981" />
    <!--/default-meta-->
    <link rel="icon" type="image/png" href="/src/assets/Favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontes sem travar a primeira pintura: o CSS do Google chega em paralelo e as letras
         trocam sozinhas (display=swap). As do visual novo das páginas entram pelo servidor. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <script>
      (function () {
        var hostname = window.location.hostname.toLowerCase();
        var path = window.location.pathname;
        var platformHosts = new Set(["roteiroonline.com", "www.roteiroonline.com", "localhost", "127.0.0.1"]);
        var knownPlatformPaths = new Set([
          "/",
          "/login",
          "/register",
          "/forgot-password",
          "/reset-password",
          "/create-password",
          "/pedido",
          "/planos",
          "/profissionalmensal",
          "/profissionalanual",
          "/agenciamensal",
          "/agenciaanual",
          "/escalamensal",
          "/escalaanual",
          "/profissional",
          "/agencia",
          "/escala"
        ]);
        var isAdminRoute = path === "/admin" || path.startsWith("/admin/");
        var isCustomDomain = hostname && !platformHosts.has(hostname) && !isAdminRoute;
        var isPublicPlatformRoute = path.startsWith("/p/") || (!knownPlatformPaths.has(path) && !path.startsWith("/admin"));
        if (isCustomDomain || isPublicPlatformRoute) {
          document.documentElement.style.backgroundColor = "#000";
          var applyPublicShell = function () {
            if (!document.body) return;
            document.body.classList.add("public-shell");
            document.body.style.backgroundColor = "#000";
          };
          if (document.body) applyPublicShell();
          else document.addEventListener("DOMContentLoaded", applyPublicShell, { once: true });
        }
      })();
    </script>
  </head>
  <body class="font-body bg-slate-50 text-slate-900">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
